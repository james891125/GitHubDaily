<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 辦公服務平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231f3d63'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif'>AI</text></svg>" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <a href="#main" class="hidden">跳到主要內容</a>
  <header class="sys-header">
    <div class="inner">
      <div class="sys-title">
        <a href="#/">AI 辦公服務平台</a>
        <span>開源工具整合・常用流程線上辦理</span>
      </div>
      <div class="sys-user">
        <span id="today"></span>
        <a href="#/settings" id="ai-status" class="ai-status off">AI：尚未設定</a>
        <button class="menu-toggle" id="menu-toggle" aria-label="功能選單">功能選單</button>
      </div>
    </div>
  </header>
  <div class="crumb-bar"><nav class="crumbs" id="crumbs" aria-label="目前位置"></nav></div>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="功能選單"></nav>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
  <footer class="sys-footer">
    資料、金鑰與產出檔案皆儲存於本機（studio/data），僅在使用 AI 時將處理內容傳送給您設定的 AI 服務。
  </footer>
  <div id="toast" class="toast hidden" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
